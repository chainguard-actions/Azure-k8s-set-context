name: Test kubeconfig method with context selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-context
        name: Set Kubernetes context selecting specific context from multi-context kubeconfig
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://127.0.0.1:6443
                insecure-skip-tls-verify: true
              name: cluster-one
            - cluster:
                server: https://127.0.0.2:6443
                insecure-skip-tls-verify: true
              name: cluster-two
            contexts:
            - context:
                cluster: cluster-one
                user: user-one
                namespace: default
              name: context-one
            - context:
                cluster: cluster-two
                user: user-two
                namespace: default
              name: context-two
            current-context: context-one
            users:
            - name: user-one
              user:
                token: fake-token-one
            - name: user-two
              user:
                token: fake-token-two
          context: context-two

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG value: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable was not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set"

      - name: Assert kubeconfig file exists and contains both clusters
        run: |
          echo "Kubeconfig contents:"
          cat "$KUBECONFIG"
          if ! grep -q "cluster-two" "$KUBECONFIG"; then
            echo "FAIL: kubeconfig does not contain cluster-two"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster"

      - name: Assert selected context is active
        run: |
          CURRENT_CONTEXT=$(kubectl config --kubeconfig="$KUBECONFIG" current-context 2>/dev/null || echo "kubectl-not-available")
          echo "Current context: $CURRENT_CONTEXT"
          if [ "$CURRENT_CONTEXT" = "kubectl-not-available" ]; then
            echo "INFO: kubectl not available, skipping context assertion"
          elif [ "$CURRENT_CONTEXT" != "context-two" ]; then
            echo "FAIL: expected current-context to be 'context-two', got '$CURRENT_CONTEXT'"
            exit 1
          else
            echo "PASS: current context is context-two"
          fi
