name: Test kubeconfig method with plaintext kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare RUNNER_TEMP
        run: |
          mkdir -p /tmp/runner-temp-plain
          echo "RUNNER_TEMP=/tmp/runner-temp-plain" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://test-cluster.example.com
                insecure-skip-tls-verify: true
              name: test-cluster
            contexts:
            - context:
                cluster: test-cluster
                user: test-user
              name: test-context
            current-context: test-context
            users:
            - name: test-user
              user:
                token: test-token-value

      - name: Assert kubeconfig file was created and contains expected content
        run: |
          echo "KUBECONFIG env var: $KUBECONFIG"
          echo "Contents of RUNNER_TEMP:"
          ls -la /tmp/runner-temp-plain/ || echo "(empty or missing)"

          # Find the kubeconfig file - prefer $KUBECONFIG if set, else search RUNNER_TEMP
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-plain/kubeconfig_* 2>/dev/null | head -1)
          fi

          echo "Using kubeconfig file: $KC_FILE"

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found in RUNNER_TEMP or KUBECONFIG env var"
            exit 1
          fi

          if [ ! -f "$KC_FILE" ]; then
            echo "FAIL: kubeconfig file does not exist at $KC_FILE"
            exit 1
          fi

          echo "Kubeconfig contents:"
          cat "$KC_FILE"

          if ! grep -q "test-cluster.example.com" "$KC_FILE"; then
            echo "FAIL: kubeconfig does not contain expected cluster server URL"
            exit 1
          fi

          echo "PASS: kubeconfig file exists and contains expected cluster server URL"

      - name: Assert kubeconfig file permissions are 600
        run: |
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-plain/kubeconfig_* 2>/dev/null | head -1)
          fi

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found"
            exit 1
          fi

          PERMS=$(stat -c "%a" "$KC_FILE")
          echo "File permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
