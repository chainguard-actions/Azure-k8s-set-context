name: Test kubeconfig method with generic cluster
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock kubeconfig
        id: mock-kubeconfig
        run: |
          KUBECONFIG_CONTENT=$(cat <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://mock-cluster.example.com
              insecure-skip-tls-verify: true
            name: mock-cluster
          contexts:
          - context:
              cluster: mock-cluster
              user: mock-user
              namespace: default
            name: mock-context
          current-context: mock-context
          users:
          - name: mock-user
            user:
              token: mock-token-value
          EOF
          )
          echo "kubeconfig<<KUBECONFIG_EOF" >> $GITHUB_OUTPUT
          echo "$KUBECONFIG_CONTENT" >> $GITHUB_OUTPUT
          echo "KUBECONFIG_EOF" >> $GITHUB_OUTPUT

      - id: set-context
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://mock-cluster.example.com
                insecure-skip-tls-verify: true
              name: mock-cluster
            contexts:
            - context:
                cluster: mock-cluster
                user: mock-user
                namespace: default
              name: mock-context
            current-context: mock-context
            users:
            - name: mock-user
              user:
                token: mock-token-value

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG value: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists and is readable
        run: |
          echo "Checking kubeconfig file at: $KUBECONFIG"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert kubeconfig contains expected cluster
        run: |
          echo "Kubeconfig contents:"
          cat "$KUBECONFIG"
          if ! grep -q "mock-cluster" "$KUBECONFIG"; then
            echo "FAIL: kubeconfig does not contain expected cluster 'mock-cluster'"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster"

      - name: Assert kubectl can read the context
        run: |
          if ! command -v kubectl &> /dev/null; then
            echo "kubectl not available, skipping kubectl check"
            exit 0
          fi
          CURRENT_CONTEXT=$(kubectl config current-context)
          echo "Current context: $CURRENT_CONTEXT"
          if [ "$CURRENT_CONTEXT" != "mock-context" ]; then
            echo "FAIL: expected current context 'mock-context', got '$CURRENT_CONTEXT'"
            exit 1
          fi
          echo "PASS: current context is mock-context"
