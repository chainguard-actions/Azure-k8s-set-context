name: Test kubeconfig method with generic cluster
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal kubeconfig
        id: create-kubeconfig
        run: |
          KUBECONFIG_CONTENT=$(cat <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
              namespace: default
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token-for-testing
          EOF
          )
          echo "kubeconfig<<KUBECONFIG_EOF" >> $GITHUB_OUTPUT
          echo "$KUBECONFIG_CONTENT" >> $GITHUB_OUTPUT
          echo "KUBECONFIG_EOF" >> $GITHUB_OUTPUT

      - id: set-context
        name: Set Kubernetes context using kubeconfig
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://127.0.0.1:6443
                insecure-skip-tls-verify: true
              name: test-cluster
            contexts:
            - context:
                cluster: test-cluster
                user: test-user
                namespace: default
              name: test-context
            current-context: test-context
            users:
            - name: test-user
              user:
                token: fake-token-for-testing
          context: test-context

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG value: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable was not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          echo "Checking kubeconfig file at: $KUBECONFIG"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert kubeconfig contains expected context
        run: |
          echo "Kubeconfig contents:"
          cat "$KUBECONFIG"
          if ! grep -q "test-cluster" "$KUBECONFIG"; then
            echo "FAIL: kubeconfig does not contain expected cluster name"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster"
