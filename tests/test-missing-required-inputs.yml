name: Test missing required inputs for service-account method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-context
        name: Attempt service-account method without required k8s-url and k8s-secret
        uses: .
        continue-on-error: true
        with:
          cluster-type: generic
          method: service-account
          # Intentionally omitting k8s-url, k8s-secret, and token to trigger error

      - name: Assert action failed due to missing inputs
        env:
          OUTCOME: ${{ steps.set-context.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required inputs are missing, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required inputs were missing"
