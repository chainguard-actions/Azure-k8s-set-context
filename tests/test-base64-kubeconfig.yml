name: Test base64-encoded kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare base64 kubeconfig
        id: prep
        run: |
          cat > /tmp/kc.yaml <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://b64.example.com:6443
            name: b64-cluster
          contexts:
          - context:
              cluster: b64-cluster
              user: b64-user
            name: b64-context
          current-context: b64-context
          users:
          - name: b64-user
            user:
              token: b64-token-value
          EOF
          echo "encoded=$(base64 -w0 /tmp/kc.yaml)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          method: kubeconfig
          kubeconfig-encoding: base64
          kubeconfig: ${{ steps.prep.outputs.encoded }}
      - name: Assert decoded kubeconfig written
        run: |
          echo "KUBECONFIG=$KUBECONFIG"
          [ -f "$KUBECONFIG" ] || { echo "FAIL: kubeconfig file missing"; exit 1; }
          cat "$KUBECONFIG"
          grep -q 'https://b64.example.com:6443' "$KUBECONFIG" || { echo "FAIL: decoded server missing"; exit 1; }
          grep -q 'current-context: b64-context' "$KUBECONFIG" || { echo "FAIL: decoded context missing"; exit 1; }
          if diff -q /tmp/kc.yaml "$KUBECONFIG" >/dev/null; then
            echo "decoded content matches original exactly"
          else
            echo "FAIL: decoded content differs from original"; diff /tmp/kc.yaml "$KUBECONFIG"; exit 1
          fi
          echo "PASS"
