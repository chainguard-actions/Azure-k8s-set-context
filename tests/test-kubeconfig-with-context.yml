name: Test kubeconfig method with context selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare RUNNER_TEMP
        run: |
          mkdir -p /tmp/runner-temp-ctx
          echo "RUNNER_TEMP=/tmp/runner-temp-ctx" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          context: staging-context
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://prod-cluster.example.com
                insecure-skip-tls-verify: true
              name: prod-cluster
            - cluster:
                server: https://staging-cluster.example.com
                insecure-skip-tls-verify: true
              name: staging-cluster
            contexts:
            - context:
                cluster: prod-cluster
                user: prod-user
              name: prod-context
            - context:
                cluster: staging-cluster
                user: staging-user
              name: staging-context
            current-context: prod-context
            users:
            - name: prod-user
              user:
                token: prod-token
            - name: staging-user
              user:
                token: staging-token

      - name: Assert kubeconfig file was created with correct context
        run: |
          echo "KUBECONFIG env var: $KUBECONFIG"
          echo "Contents of RUNNER_TEMP:"
          ls -la /tmp/runner-temp-ctx/ || echo "(empty or missing)"

          # Find the kubeconfig file - prefer $KUBECONFIG if set, else search RUNNER_TEMP
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-ctx/kubeconfig_* 2>/dev/null | head -1)
          fi

          echo "Using kubeconfig file: $KC_FILE"

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found in RUNNER_TEMP or KUBECONFIG env var"
            exit 1
          fi

          if [ ! -f "$KC_FILE" ]; then
            echo "FAIL: kubeconfig file does not exist at $KC_FILE"
            exit 1
          fi

          echo "Kubeconfig contents:"
          cat "$KC_FILE"

          # The action uses @kubernetes/client-node which exports as JSON
          # Check for staging-context as current-context (works for both JSON and YAML)
          if ! grep -q "staging-context" "$KC_FILE"; then
            echo "FAIL: kubeconfig does not contain staging-context"
            exit 1
          fi

          # Verify staging-context is the current-context
          # Works for both JSON format: "current-context":"staging-context"
          # and YAML format: current-context: staging-context
          if grep -q '"current-context"' "$KC_FILE"; then
            # JSON format
            CURRENT=$(grep -o '"current-context":"[^"]*"' "$KC_FILE" | cut -d'"' -f4)
          else
            # YAML format
            CURRENT=$(grep "current-context:" "$KC_FILE" | awk '{print $2}')
          fi

          echo "current-context: $CURRENT"
          if [ "$CURRENT" != "staging-context" ]; then
            echo "FAIL: expected current-context to be 'staging-context', got '$CURRENT'"
            exit 1
          fi
          echo "PASS: current-context is correctly set to staging-context"
