name: Test kubeconfig method with specific context selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check node version
        run: node --version

      - id: set-context
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          context: second-context
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://first-cluster.example.com
              name: first-cluster
            - cluster:
                server: https://second-cluster.example.com
              name: second-cluster
            contexts:
            - context:
                cluster: first-cluster
                user: first-user
              name: first-context
            - context:
                cluster: second-cluster
                user: second-user
              name: second-context
            current-context: first-context
            users:
            - name: first-user
              user:
                token: fake-token-1
            - name: second-user
              user:
                token: fake-token-2

      - name: Debug environment
        run: |
          echo "KUBECONFIG=$KUBECONFIG"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          ls -la /tmp/kubeconfig_* 2>/dev/null || echo "No kubeconfig files in /tmp"

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG env var is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert current-context is set to second-context
        run: |
          echo "Contents of kubeconfig:"
          cat "$KUBECONFIG"
          CURRENT_CONTEXT=$(grep "current-context" "$KUBECONFIG" | head -1 | sed 's/.*current-context[": ]*//;s/[",].*//;s/^ *//;s/ *$//')
          echo "current-context: $CURRENT_CONTEXT"
          if [ "$CURRENT_CONTEXT" != "second-context" ]; then
            echo "FAIL: expected current-context to be 'second-context', got '$CURRENT_CONTEXT'"
            exit 1
          fi
          echo "PASS: current-context is correctly set to 'second-context'"

      - name: Assert kubeconfig file permissions are 600
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
