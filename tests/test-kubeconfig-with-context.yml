name: Test kubeconfig method with context selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up RUNNER_TEMP
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "RUNNER_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - id: set-context
        name: Run k8s-set-context with kubeconfig method and explicit context
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          context: second-context
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://127.0.0.1:6443
                insecure-skip-tls-verify: true
              name: first-cluster
            - cluster:
                server: https://127.0.0.2:6443
                insecure-skip-tls-verify: true
              name: second-cluster
            contexts:
            - context:
                cluster: first-cluster
                user: first-user
              name: first-context
            - context:
                cluster: second-cluster
                user: second-user
              name: second-context
            current-context: first-context
            users:
            - name: first-user
              user:
                token: fake-token-first
            - name: second-user
              user:
                token: fake-token-second

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG value: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert current-context is set to second-context
        run: |
          CONTENT=$(cat "$KUBECONFIG")
          echo "Kubeconfig content:"
          echo "$CONTENT"
          # The context should have been switched to second-context
          if ! echo "$CONTENT" | grep -q "second-context"; then
            echo "FAIL: kubeconfig does not contain second-context"
            exit 1
          fi
          echo "PASS: kubeconfig contains second-context"

      - name: Assert kubeconfig file has correct permissions
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
