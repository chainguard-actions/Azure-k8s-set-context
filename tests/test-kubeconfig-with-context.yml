name: Test kubeconfig method with explicit context selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-context
        name: Run action with kubeconfig method and explicit context
        uses: .
        env:
          RUNNER_TEMP: /tmp
        with:
          cluster-type: generic
          method: kubeconfig
          context: second-context
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://cluster-one.example.com
                insecure-skip-tls-verify: true
              name: cluster-one
            - cluster:
                server: https://cluster-two.example.com
                insecure-skip-tls-verify: true
              name: cluster-two
            contexts:
            - context:
                cluster: cluster-one
                user: user-one
              name: first-context
            - context:
                cluster: cluster-two
                user: user-two
              name: second-context
            current-context: first-context
            users:
            - name: user-one
              user:
                token: fake-token-one
            - name: user-two
              user:
                token: fake-token-two

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set"

      - name: Assert kubeconfig file exists
        run: |
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert current-context is set to second-context
        run: |
          echo "Kubeconfig contents:"
          cat "$KUBECONFIG"
          # The action uses @kubernetes/client-node which exports kubeconfig as JSON.
          # Try JSON parsing first, then fall back to YAML grep.
          if command -v jq >/dev/null 2>&1; then
            CURRENT_CTX=$(jq -r '."current-context" // empty' "$KUBECONFIG" 2>/dev/null)
          fi
          if [ -z "$CURRENT_CTX" ]; then
            # Fall back to YAML grep
            CURRENT_CTX=$(grep "current-context:" "$KUBECONFIG" | awk '{print $2}' | tr -d '"')
          fi
          echo "current-context: $CURRENT_CTX"
          if [ "$CURRENT_CTX" != "second-context" ]; then
            echo "FAIL: expected current-context to be 'second-context', got '$CURRENT_CTX'"
            exit 1
          fi
          echo "PASS: current-context is correctly set to 'second-context'"

      - name: Assert kubeconfig file permissions are 600
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
