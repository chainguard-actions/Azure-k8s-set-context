name: Test kubeconfig method with base64-encoded kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check node version
        run: node --version

      - name: Generate base64-encoded kubeconfig
        id: gen-kubeconfig
        run: |
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Config' \
            'clusters:' \
            '- cluster:' \
            '    server: https://base64-cluster.example.com' \
            '  name: base64-cluster' \
            'contexts:' \
            '- context:' \
            '    cluster: base64-cluster' \
            '    user: base64-user' \
            '  name: base64-context' \
            'current-context: base64-context' \
            'users:' \
            '- name: base64-user' \
            '  user:' \
            '    token: fake-base64-token' \
            > /tmp/raw-kubeconfig.yaml
          ENCODED=$(base64 -w 0 /tmp/raw-kubeconfig.yaml)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - id: set-context
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ steps.gen-kubeconfig.outputs.encoded }}
          kubeconfig-encoding: base64

      - name: Debug environment
        run: |
          echo "KUBECONFIG=$KUBECONFIG"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          ls -la /tmp/kubeconfig_* 2>/dev/null || echo "No kubeconfig files in /tmp"

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG env var is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          echo "Checking file: $KUBECONFIG"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert kubeconfig file contains expected cluster (decoded correctly)
        run: |
          echo "Contents of kubeconfig:"
          cat "$KUBECONFIG"
          if ! grep -q "base64-cluster.example.com" "$KUBECONFIG"; then
            echo "FAIL: kubeconfig does not contain expected cluster URL (base64 decode may have failed)"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster URL (base64 decoded correctly)"

      - name: Assert kubeconfig file permissions are 600
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
