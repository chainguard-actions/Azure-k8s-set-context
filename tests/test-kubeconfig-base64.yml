name: Test kubeconfig method with base64-encoded kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare RUNNER_TEMP
        run: |
          mkdir -p /tmp/runner-temp-b64
          echo "RUNNER_TEMP=/tmp/runner-temp-b64" >> $GITHUB_ENV

      - name: Prepare base64-encoded kubeconfig
        id: prep
        run: |
          printf 'apiVersion: v1\nkind: Config\nclusters:\n- cluster:\n    server: https://base64-cluster.example.com\n    insecure-skip-tls-verify: true\n  name: base64-cluster\ncontexts:\n- context:\n    cluster: base64-cluster\n    user: base64-user\n  name: base64-context\ncurrent-context: base64-context\nusers:\n- name: base64-user\n  user:\n    token: base64-token-value\n' > /tmp/kubeconfig-plain.yaml
          echo "Plain kubeconfig:"
          cat /tmp/kubeconfig-plain.yaml
          ENCODED=$(base64 -w 0 /tmp/kubeconfig-plain.yaml)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: ${{ steps.prep.outputs.encoded }}
          kubeconfig-encoding: base64

      - name: Assert kubeconfig file was created and contains decoded content
        run: |
          echo "KUBECONFIG env var: $KUBECONFIG"
          echo "Contents of RUNNER_TEMP:"
          ls -la /tmp/runner-temp-b64/ || echo "(empty or missing)"

          # Find the kubeconfig file - prefer $KUBECONFIG if set, else search RUNNER_TEMP
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-b64/kubeconfig_* 2>/dev/null | head -1)
          fi

          echo "Using kubeconfig file: $KC_FILE"

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found in RUNNER_TEMP or KUBECONFIG env var"
            exit 1
          fi

          if [ ! -f "$KC_FILE" ]; then
            echo "FAIL: kubeconfig file does not exist at $KC_FILE"
            exit 1
          fi

          echo "Kubeconfig contents:"
          cat "$KC_FILE"

          if ! grep -q "base64-cluster.example.com" "$KC_FILE"; then
            echo "FAIL: kubeconfig does not contain expected decoded cluster server URL"
            exit 1
          fi

          echo "PASS: kubeconfig file exists and contains expected decoded cluster server URL"
