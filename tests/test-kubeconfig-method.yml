name: Test kubeconfig method (generic cluster)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-context
        name: Run action with kubeconfig method
        uses: .
        env:
          RUNNER_TEMP: /tmp
        with:
          cluster-type: generic
          method: kubeconfig
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://fake-cluster.example.com
                insecure-skip-tls-verify: true
              name: test-cluster
            contexts:
            - context:
                cluster: test-cluster
                user: test-user
              name: test-context
            current-context: test-context
            users:
            - name: test-user
              user:
                token: fake-token-for-testing

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          echo "Checking file: $KUBECONFIG"
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert kubeconfig file contains cluster info
        run: |
          echo "Kubeconfig contents:"
          cat "$KUBECONFIG"
          if ! grep -q "fake-cluster.example.com" "$KUBECONFIG"; then
            echo "FAIL: kubeconfig does not contain expected cluster URL"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster URL"

      - name: Assert kubeconfig file permissions are 600
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
