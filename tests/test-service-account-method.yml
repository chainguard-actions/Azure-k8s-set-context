name: Test service-account method (generic cluster)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up RUNNER_TEMP
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "RUNNER_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Prepare base64-encoded fake CA cert and token
        run: |
          # Create a minimal fake CA cert (base64 encoded)
          FAKE_CA=$(echo "fake-ca-cert-data" | base64 -w 0)
          # Create a fake token (base64 encoded, will be decoded by the action)
          FAKE_TOKEN=$(echo "fake-service-account-token" | base64 -w 0)
          echo "FAKE_CA=$FAKE_CA" >> "$GITHUB_ENV"
          echo "FAKE_TOKEN=$FAKE_TOKEN" >> "$GITHUB_ENV"

      - id: set-context
        name: Run k8s-set-context with service-account method
        uses: .
        with:
          cluster-type: generic
          method: service-account
          k8s-url: https://127.0.0.1:6443
          k8s-secret: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: test-sa-secret
            type: kubernetes.io/service-account-token
            data:
              ca.crt: ZmFrZS1jYS1jZXJ0LWRhdGE=
              token: ZmFrZS1zZXJ2aWNlLWFjY291bnQtdG9rZW4=

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG value: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert kubeconfig file has correct permissions
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"

      - name: Assert kubeconfig contains cluster URL
        run: |
          CONTENT=$(cat "$KUBECONFIG")
          echo "Kubeconfig content:"
          echo "$CONTENT"
          if ! echo "$CONTENT" | grep -q "127.0.0.1:6443"; then
            echo "FAIL: kubeconfig does not contain expected cluster URL"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster URL"
