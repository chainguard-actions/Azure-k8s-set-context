name: Test service-account method (generic cluster)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-context
        name: Run action with service-account method
        uses: .
        env:
          RUNNER_TEMP: /tmp
        with:
          cluster-type: generic
          method: service-account
          k8s-url: https://fake-k8s-cluster.example.com:6443
          k8s-secret: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: test-sa-secret
            type: kubernetes.io/service-account-token
            data:
              ca.crt: ZmFrZS1jYS1jZXJ0aWZpY2F0ZS1kYXRh
              token: ZmFrZS1zZXJ2aWNlLWFjY291bnQtdG9rZW4=

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG environment variable is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert kubeconfig contains cluster URL
        run: |
          echo "Kubeconfig contents:"
          cat "$KUBECONFIG"
          if ! grep -q "fake-k8s-cluster.example.com" "$KUBECONFIG"; then
            echo "FAIL: kubeconfig does not contain expected cluster URL"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster URL"

      - name: Assert kubeconfig file permissions are 600
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
