name: Test arc cluster type with resource-group and cluster-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-context
        name: Run action with arc cluster type (kubeconfig method - expected to fail)
        uses: .
        continue-on-error: true
        with:
          cluster-type: arc
          method: kubeconfig
          resource-group: my-resource-group
          cluster-name: my-arc-cluster
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://mock-cluster.example.com
                insecure-skip-tls-verify: true
              name: mock-cluster
            contexts:
            - context:
                cluster: mock-cluster
                user: mock-user
                namespace: default
              name: mock-context
            current-context: mock-context
            users:
            - name: mock-user
              user:
                token: mock-token-value

      - name: Assert action failed with expected error (kubeconfig not supported for arc)
        env:
          OUTCOME: ${{ steps.set-context.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using kubeconfig method with arc cluster type"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported kubeconfig method on arc cluster"
