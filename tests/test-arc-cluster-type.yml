name: Test arc cluster type with resource-group and cluster-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-context
        name: Run k8s-set-context with arc cluster type
        uses: .
        continue-on-error: true
        with:
          cluster-type: arc
          method: service-principal
          resource-group: my-resource-group
          cluster-name: my-arc-cluster

      - name: Assert action ran with arc inputs (expected to fail without Azure credentials)
        env:
          OUTCOME: ${{ steps.set-context.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          # The action is expected to fail because there are no real Azure credentials
          # in the test environment. What matters is that the inputs resource-group and
          # cluster-name were accepted (not rejected as missing/invalid inputs).
          # A failure due to missing Azure credentials or az CLI issues is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without Azure credentials"
            echo "The inputs resource-group and cluster-name were passed to the action"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: arc cluster-type test with resource-group and cluster-name inputs completed"
