name: Test basic plaintext kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          method: kubeconfig
          kubeconfig: |
            apiVersion: v1
            kind: Config
            clusters:
            - cluster:
                server: https://basic.example.com:6443
                insecure-skip-tls-verify: true
              name: basic-cluster
            contexts:
            - context:
                cluster: basic-cluster
                user: basic-user
              name: basic-context
            current-context: basic-context
            users:
            - name: basic-user
              user:
                token: basic-token-value
      - name: Assert KUBECONFIG exported and written
        run: |
          echo "KUBECONFIG=$KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG not exported"; exit 1
          fi
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist"; exit 1
          fi
          PERMS=$(stat -c '%a' "$KUBECONFIG")
          echo "perms: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected perms 600"; exit 1
          fi
          cat "$KUBECONFIG"
          grep -q 'https://basic.example.com:6443' "$KUBECONFIG" || { echo "FAIL: server missing"; exit 1; }
          grep -q 'current-context: basic-context' "$KUBECONFIG" || { echo "FAIL: current-context missing"; exit 1; }
          grep -q 'basic-token-value' "$KUBECONFIG" || { echo "FAIL: token missing"; exit 1; }
          echo "PASS"
