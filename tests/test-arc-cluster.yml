name: Test arc cluster type with resource-group and cluster-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare RUNNER_TEMP
        run: |
          mkdir -p /tmp/runner-temp-arc
          echo "RUNNER_TEMP=/tmp/runner-temp-arc" >> $GITHUB_ENV

      - name: Create fake az CLI to mock Azure Arc commands
        run: |
          # Write a fake kubeconfig that the mock az will produce
          cat > /tmp/fake-arc-kubeconfig.yaml << 'KUBEEOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://arc-cluster.example.com
              insecure-skip-tls-verify: true
            name: arc-test-cluster
          contexts:
          - context:
              cluster: arc-test-cluster
              user: arc-test-user
            name: arc-test-context
          current-context: arc-test-context
          users:
          - name: arc-test-user
            user:
              token: arc-fake-token
          KUBEEOF

          # Write the fake az script
          cat > /tmp/fake-az << 'AZEOF'
          #!/bin/sh
          # Fake az CLI for testing arc cluster type
          # Handles: az extension add -n connectedk8s
          # Handles: az connectedk8s proxy -n <name> -g <rg> -f <file>
          case "$*" in
            *"extension add"*)
              echo "Extension connectedk8s already installed (mock)"
              exit 0
              ;;
            *"connectedk8s proxy"*)
              # Extract the -f argument (output kubeconfig file path)
              out_file=""
              prev=""
              for arg in "$@"; do
                if [ "$prev" = "-f" ]; then
                  out_file="$arg"
                fi
                prev="$arg"
              done
              if [ -n "$out_file" ]; then
                cp /tmp/fake-arc-kubeconfig.yaml "$out_file"
                echo "Mock: wrote kubeconfig to $out_file"
              fi
              exit 0
              ;;
            *)
              echo "Mock az: unhandled command: $*" >&2
              exit 1
              ;;
          esac
          AZEOF
          chmod +x /tmp/fake-az

          # Place fake az at the front of PATH
          mkdir -p /tmp/fake-bin
          ln -sf /tmp/fake-az /tmp/fake-bin/az
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          cluster-type: arc
          method: service-principal
          resource-group: my-resource-group
          cluster-name: my-arc-cluster

      - name: Assert kubeconfig file was created and contains expected content
        run: |
          echo "KUBECONFIG env var: $KUBECONFIG"
          echo "Contents of RUNNER_TEMP:"
          ls -la /tmp/runner-temp-arc/ || echo "(empty or missing)"

          # Find the kubeconfig file - prefer $KUBECONFIG if set, else search RUNNER_TEMP
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-arc/kubeconfig_* 2>/dev/null | head -1)
          fi

          echo "Using kubeconfig file: $KC_FILE"

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found in RUNNER_TEMP or KUBECONFIG env var"
            exit 1
          fi

          if [ ! -f "$KC_FILE" ]; then
            echo "FAIL: kubeconfig file does not exist at $KC_FILE"
            exit 1
          fi

          echo "Kubeconfig contents:"
          cat "$KC_FILE"

          if ! grep -q "arc-cluster.example.com" "$KC_FILE"; then
            echo "FAIL: kubeconfig does not contain expected arc cluster server URL"
            exit 1
          fi

          echo "PASS: kubeconfig file exists and contains expected arc cluster server URL"

      - name: Assert kubeconfig file permissions are 600
        run: |
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-arc/kubeconfig_* 2>/dev/null | head -1)
          fi

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found"
            exit 1
          fi

          PERMS=$(stat -c "%a" "$KC_FILE")
          echo "File permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
