name: Test arc cluster type with resource-group and cluster-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check node version
        run: node --version

      - id: set-context
        uses: .
        continue-on-error: true
        with:
          cluster-type: arc
          method: service-principal
          resource-group: my-resource-group
          cluster-name: my-arc-cluster

      - name: Assert action ran with arc inputs (expected to fail without Azure credentials)
        run: |
          OUTCOME="${{ steps.set-context.outcome }}"
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail because there are no real Azure credentials
          # or az CLI connectedk8s extension in this environment.
          # What matters is that resource-group and cluster-name inputs were accepted
          # (i.e., the action did NOT fail due to missing required inputs).
          # A failure here means the action ran and failed at the Azure CLI step,
          # which is the expected behavior in a test environment without Azure auth.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no Azure credentials in test env)"
            echo "The resource-group and cluster-name inputs were accepted by the action."
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: arc cluster-type test with resource-group and cluster-name completed"
