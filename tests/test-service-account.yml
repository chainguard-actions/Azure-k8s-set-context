name: Test service-account method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          method: service-account
          k8s-url: https://sa.example.com:443
          # token is base64 of "sa-secret-token"
          k8s-secret: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: sa-secret
            data:
              ca.crt: ZmFrZS1jYS1kYXRh
              token: c2Etc2VjcmV0LXRva2Vu
      - name: Assert kubeconfig generated from service account
        run: |
          echo "KUBECONFIG=$KUBECONFIG"
          [ -f "$KUBECONFIG" ] || { echo "FAIL: kubeconfig file missing"; exit 1; }
          cat "$KUBECONFIG"; echo
          grep -q 'https://sa.example.com:443' "$KUBECONFIG" || { echo "FAIL: server missing"; exit 1; }
          grep -q 'sa-secret-token' "$KUBECONFIG" || { echo "FAIL: decoded token missing"; exit 1; }
          grep -q 'ZmFrZS1jYS1kYXRh' "$KUBECONFIG" || { echo "FAIL: ca data missing"; exit 1; }
          echo "PASS"
