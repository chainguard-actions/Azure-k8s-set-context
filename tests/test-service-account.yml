name: Test service-account method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check node version
        run: node --version

      - name: Prepare service account secret values
        id: prep
        run: |
          # Create a fake base64-encoded token (the action decodes it from base64)
          FAKE_TOKEN=$(echo -n "fake-service-account-token" | base64)
          echo "token=$FAKE_TOKEN" >> $GITHUB_OUTPUT

          # Create a fake CA cert (base64-encoded)
          FAKE_CA=$(echo -n "fake-ca-cert-data" | base64)
          echo "ca=$FAKE_CA" >> $GITHUB_OUTPUT

      - id: set-context
        uses: .
        with:
          cluster-type: generic
          method: service-account
          k8s-url: https://service-account-cluster.example.com
          k8s-secret: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: test-sa-secret
            data:
              token: ${{ steps.prep.outputs.token }}
              ca.crt: ${{ steps.prep.outputs.ca }}

      - name: Debug environment
        run: |
          echo "KUBECONFIG=$KUBECONFIG"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          ls -la /tmp/kubeconfig_* 2>/dev/null || echo "No kubeconfig files in /tmp"

      - name: Assert KUBECONFIG env var is set
        run: |
          echo "KUBECONFIG: $KUBECONFIG"
          if [ -z "$KUBECONFIG" ]; then
            echo "FAIL: KUBECONFIG env var is not set"
            exit 1
          fi
          echo "PASS: KUBECONFIG is set to $KUBECONFIG"

      - name: Assert kubeconfig file exists
        run: |
          if [ ! -f "$KUBECONFIG" ]; then
            echo "FAIL: kubeconfig file does not exist at $KUBECONFIG"
            exit 1
          fi
          echo "PASS: kubeconfig file exists"

      - name: Assert kubeconfig contains expected cluster URL
        run: |
          echo "Contents of kubeconfig:"
          cat "$KUBECONFIG"
          if ! grep -q "service-account-cluster.example.com" "$KUBECONFIG"; then
            echo "FAIL: kubeconfig does not contain expected cluster URL"
            exit 1
          fi
          echo "PASS: kubeconfig contains expected cluster URL"

      - name: Assert kubeconfig file permissions are 600
        run: |
          PERMS=$(stat -c "%a" "$KUBECONFIG")
          echo "Permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
