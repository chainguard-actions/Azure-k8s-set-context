name: Test service-account method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare RUNNER_TEMP
        run: |
          mkdir -p /tmp/runner-temp-sa
          echo "RUNNER_TEMP=/tmp/runner-temp-sa" >> $GITHUB_ENV

      - name: Prepare service account secret
        id: prep
        run: |
          # Use base64-encoded values matching the format expected by the action
          # ca.crt and token must be base64-encoded strings in the secret data
          FAKE_CA=$(printf 'fake-ca-cert-data' | base64 -w 0)
          FAKE_TOKEN=$(printf 'fake-service-account-token' | base64 -w 0)

          echo "FAKE_CA=$FAKE_CA"
          echo "FAKE_TOKEN=$FAKE_TOKEN"

          # Write the k8s secret YAML using printf to avoid heredoc YAML parse issues
          printf 'apiVersion: v1\ndata:\n  ca.crt: %s\n  token: %s\nkind: Secret\nmetadata:\n  name: test-sa-secret\ntype: kubernetes.io/service-account-token\n' "$FAKE_CA" "$FAKE_TOKEN" > /tmp/k8s-secret.yaml

          echo "Secret YAML:"
          cat /tmp/k8s-secret.yaml

          # Store the secret content as a multiline output
          {
            echo "secret<<EOFDELIM"
            cat /tmp/k8s-secret.yaml
            echo "EOFDELIM"
          } >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          cluster-type: generic
          method: service-account
          k8s-url: https://sa-cluster.example.com
          k8s-secret: ${{ steps.prep.outputs.secret }}

      - name: Assert kubeconfig file was created and contains cluster URL
        run: |
          echo "KUBECONFIG env var: $KUBECONFIG"
          echo "Contents of RUNNER_TEMP:"
          ls -la /tmp/runner-temp-sa/ || echo "(empty or missing)"

          # Find the kubeconfig file - prefer $KUBECONFIG if set, else search RUNNER_TEMP
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-sa/kubeconfig_* 2>/dev/null | head -1)
          fi

          echo "Using kubeconfig file: $KC_FILE"

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found in RUNNER_TEMP or KUBECONFIG env var"
            exit 1
          fi

          if [ ! -f "$KC_FILE" ]; then
            echo "FAIL: kubeconfig file does not exist at $KC_FILE"
            exit 1
          fi

          echo "Kubeconfig contents:"
          cat "$KC_FILE"

          if ! grep -q "sa-cluster.example.com" "$KC_FILE"; then
            echo "FAIL: kubeconfig does not contain expected cluster URL"
            exit 1
          fi

          echo "PASS: kubeconfig file exists and contains expected cluster URL"

      - name: Assert kubeconfig file permissions are 600
        run: |
          KC_FILE=""
          if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
            KC_FILE="$KUBECONFIG"
          else
            KC_FILE=$(ls /tmp/runner-temp-sa/kubeconfig_* 2>/dev/null | head -1)
          fi

          if [ -z "$KC_FILE" ]; then
            echo "FAIL: No kubeconfig file found"
            exit 1
          fi

          PERMS=$(stat -c "%a" "$KC_FILE")
          echo "File permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: kubeconfig file has correct permissions (600)"
