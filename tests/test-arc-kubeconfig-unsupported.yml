name: Test arc cluster rejects kubeconfig method
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          printf '#!/bin/sh\necho "$*" >> /tmp/fake-az-unsupported.log\nexit 0\n' > "$RUNNER_TEMP/fakebin/az"
          chmod +x "$RUNNER_TEMP/fakebin/az"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          cluster-type: arc
          method: kubeconfig
          resource-group: my-test-rg
          cluster-name: my-arc-cluster
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for kubeconfig method on arc cluster"
            exit 1
          fi
          echo "PASS"
